services:
  database:
    image: smart-chatbot-postgres:latest
    build:
      context: ./packages/database
      dockerfile: Dockerfile.postgres
    container_name: smart-chatbot-postgres
    ports:
      - "5428:5432"
    env_file:
      - ./packages/database/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    # Healthcheck memastikan database siap menerima koneksi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  mongodb:
    image: smart-chatbot-mongo:latest
    build:
      context: ./packages/database
      dockerfile: Dockerfile.mongo
    container_name: smart-chatbot-mongo
    ports:
      - "27028:27017"
    env_file:
      - ./packages/database/.env
    volumes:
      - mongo-data:/data/db
    restart: always
    networks:
      - app-network

# Catatan:
# Docker Compose secara default TIDAK akan me-recreate container jika tidak ada perubahan config.
# Jika ingin memaksa untuk tidak me-recreate walau ada perubahan, gunakan command:
# docker-compose up -d --no-recreate

volumes:
  postgres-data:
  mongo-data:

networks:
  app-network:
    driver: bridge
